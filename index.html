<!DOCTYPE html>

<html lang="en">

<head>

  <title>Branded By Winni | Digital Branding Studio</title>

  <!-- Optimized Font Loading with Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet">

  <!-- DNS Prefetch for faster external resource loading -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <!-- Preload Critical Hero Image (LCP Optimization) -->
  <link rel="preload" as="image" href="/hero-1.avif" type="image/avif">
  <link rel="preload" as="image" href="/hero-1.webp" type="image/webp">

  <link rel="stylesheet" href="/index.css">

</head>

<body>
  <script>
    // Catch and display errors visibly
    window.addEventListener('error', function (e) {
      document.body.innerHTML = '<div style="padding: 20px; font-family: monospace; color: red; white-space: pre-wrap;">' +
        'ERROR: ' + e.message + '\n\n' +
        'File: ' + e.filename + '\n' +
        'Line: ' + e.lineno + '\n' +
        'Stack: ' + (e.error ? e.error.stack : 'N/A') +
        '</div>';
    });

    // Force unregister Service Worker immediately
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
  <div id="root">

    <div class="hero-instant" style="

        <h1 style="

          font-size: clamp(2.5rem, 5vw, 4rem);
          line-height: 1.1;
          color: #4A3B40;
          margin-bottom: 1.5rem;
          font-weight: 600;
        ">

        </h1>

        <!-- Sub-headline -->
        <p style="
          font-family: 'Inter', sans-serif;
          font-size: clamp(1.125rem, 2vw, 1.5rem);
          color: #5D4E53;
          max-width: 48rem;
          margin: 0 auto 2.5rem;
          font-weight: 300;
          line-height: 1.6;
        ">
          Branding, visual identity, and creative strategy for bold businesses ready to stand out.
        </p>

        <!-- CTA Buttons -->
        <div style="
          display: flex;
          flex-direction: column;
          gap: 1.25rem;
          align-items: center;
          margin-bottom: 2.5rem;
        ">
          <a href="https://wa.me/233244591777?text=Hi!%20I'd%20like%20to%20book%20a%20free%20brand%20audit"
            target="_blank" rel="noopener noreferrer" style="
               display: inline-flex;
               align-items: center;
               gap: 0.75rem;
               padding: 1rem 2rem;
               background-color: #E89BA7;
               color: white;
               font-family: 'Inter', sans-serif;
               font-weight: 500;
               font-size: 1.125rem;
               border-radius: 0.375rem;
               text-decoration: none;
               box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
               transition: all 0.3s;
             ">
            📱 Book a Free Brand Audit
          </a>

          <a href="#portfolio" style="
               display: inline-flex;
               align-items: center;
               gap: 0.75rem;
               padding: 1rem 2rem;
               border: 2px solid #4A3B40;
               color: #4A3B40;
               font-family: 'Inter', sans-serif;
               font-weight: 500;
               font-size: 1.125rem;
               border-radius: 0.375rem;
               text-decoration: none;
               transition: all 0.3s;
             ">
            View Our Work →
          </a>
        </div>

        <!-- Trust Indicator -->
        <p style="
          font-family: 'Inter', sans-serif;
          font-size: 0.875rem;
          color: #9C8C91;
          margin-top: 2rem;
        ">
          <strong style="color: #4A3B40;">50+ brands</strong> transformed in Ghana & beyond
        </p>
      </div>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>

  <!-- Hide instant hero once React loads -->
  <style>
    .hero-instant {
      transition: opacity 0.3s ease-out;
    }

    /* Once React loads, this will be replaced smoothly */
    #root:has(> :not(.hero-instant)) .hero-instant {
      display: none;
    }
  </style>

  <!-- Register Service Worker AFTER app loads -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('✅ SW registered'))
          .catch(err => console.log('❌ SW failed:', err));
      });
    }
  </script>
</body>

</html>
