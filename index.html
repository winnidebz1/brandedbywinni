<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/logo-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Winni Admin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Branded By Winni | Digital Branding Studio</title>
  <meta name="google-site-verification" content="ffka4kOivZvLEdkT654XPN86OLfCF94SuV248X4jOvE" />
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <script>
    const isLocalDev =
      location.hostname === 'localhost' ||
      location.hostname === '127.0.0.1';

    // Keep visible error rendering only in local dev.
    if (isLocalDev) {
      window.addEventListener('error', function (e) {
        document.body.innerHTML = '<div style="padding: 20px; font-family: monospace; color: red; white-space: pre-wrap;">' +
          'ERROR: ' + e.message + '\n\n' +
          'File: ' + e.filename + '\n' +
          'Line: ' + e.lineno + '\n' +
          'Stack: ' + (e.error ? e.error.stack : 'N/A') +
          '</div>';
      });
    }
  </script>

  <div id="root"></div>

  <script type="module" src="/index.tsx"></script>

  <script>
    const shouldRegisterSW =
      'serviceWorker' in navigator &&
      location.protocol === 'https:' &&
      location.hostname !== 'localhost' &&
      location.hostname !== '127.0.0.1';

    if (shouldRegisterSW) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered'))
          .catch(err => console.log('SW failed:', err));
      });
    }
  </script>
</body>

</html>
