<!DOCTYPE html>
<!-- Force rebuild: 2025-12-11 -->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/logo-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Winni Admin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Branded By Winni | Digital Branding Studio</title>

  <!-- Optimized Font Loading with Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet">

  <!-- DNS Prefetch for faster external resource loading -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <!-- Preload Critical Hero Image (LCP Optimization) -->
  <link rel="preload" as="image" href="/hero-1.avif" type="image/avif">
  <link rel="preload" as="image" href="/hero-1.webp" type="image/webp">

  <link rel="stylesheet" href="/index.css">

</head>

<body>
  <script>
    // Catch and display errors visibly
    window.addEventListener('error', function (e) {
      document.body.innerHTML = '<div style="padding: 20px; font-family: monospace; color: red; white-space: pre-wrap;">' +
        'ERROR: ' + e.message + '\n\n' +
        'File: ' + e.filename + '\n' +
        'Line: ' + e.lineno + '\n' +
        'Stack: ' + (e.error ? e.error.stack : 'N/A') +
        '</div>';
    });

    // Force unregister Service Worker immediately
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
  <div id="root">
    <div
      style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; font-size: 24px; color: #4A3B40;">
      Loading...
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>

  <!-- Register Service Worker AFTER app loads -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('✅ SW registered'))
          .catch(err => console.log('❌ SW failed:', err));
      });
    }
  </script>
</body>

</html>
